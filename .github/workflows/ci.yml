name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json is generated with npm 11 locally; npm 10 (bundled
      # with node 22) reads lockfileVersion 3 slightly differently and
      # fails `npm ci` with a false "out of sync" error. Match versions.
      - run: npm install -g npm@11
      - run: npm ci
      # postinstall already runs `prisma generate`, but an explicit call keeps
      # this job working even if that hook is ever removed.
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
