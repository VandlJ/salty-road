name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build --turbopack
        env:
          # prisma generate only reads the schema at build time, it doesn't
          # need a reachable database — a placeholder keeps it happy.
          DATABASE_URL: "postgresql://user:password@localhost:5432/db"
          DIRECT_DATABASE_URL: "postgresql://user:password@localhost:5432/db"
