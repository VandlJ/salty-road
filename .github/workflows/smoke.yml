name: Smoke test (production)

on:
  # Vercel auto-deploys on push to main; there's no local signal for when
  # that finishes, so this polls with retries instead of assuming a fixed
  # delay. Safe to run: read-only requests, never creates orders/registrations.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test saltyroad.cz
    runs-on: ubuntu-latest
    steps:
      - name: Homepage responds
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://saltyroad.cz/)
            if [ "$code" = "200" ]; then exit 0; fi
            echo "Attempt $i: got $code, retrying in 30s..."
            sleep 30
          done
          echo "Homepage never returned 200"; exit 1

      - name: /shop returns 200
        # No data-testid markers exist yet (see F2.1 in Test_Implementation_Plan.md)
        # to grep for reliably — just confirms the route itself doesn't 500/404.
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://saltyroad.cz/cs/shop)
          [ "$code" = "200" ] || { echo "/cs/shop returned $code"; exit 1; }

      - name: /api/shop-status responds with expected shape
        run: |
          json=$(curl -s https://saltyroad.cz/api/shop-status)
          echo "$json" | grep -q '"enabled"' || { echo "Unexpected shop-status response: $json"; exit 1; }

      - name: /sitemap.xml responds
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://saltyroad.cz/sitemap.xml)
          [ "$code" = "200" ] || { echo "sitemap.xml returned $code"; exit 1; }
